{% from "_ui.html" import icon %}
<div class="result {{ 'success' if ok else 'danger' }}" role="status">
  <div class="cluster">
    {{ icon("check-circle" if ok else "alert", "tone-success" if ok else "tone-danger") }}
    <b>{{ message }}</b>
  </div>
  <div class="message">{{ text }}</div>
  <div class="subtle">{{ bytes }} bytes</div>
</div>
