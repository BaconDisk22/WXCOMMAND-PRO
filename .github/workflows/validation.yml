name: WXCOMMAND-PRO validation

on:
  push:
    branches:
      - main
      - feature/phase3-stability-release
      - feature/phase4-ux
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile
        run: python -m compileall -q app tests
      - name: Test suite
        run: python -m pytest -q tests
      - name: No-transmit smoke checks
        run: python -m app.smokecheck
