name: Demonstration screenshots

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: screenshot-refresh-${{ github.ref }}
  cancel-in-progress: false
jobs:
  screenshots:
    name: Screenshot demo dashboard (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install headless browser
        run: |
          python -m pip install playwright==1.58.0
          python -m playwright install --with-deps chromium
      - name: Capture deterministic demonstration scenarios
        run: python scripts/capture_demo_screenshots.py
      - name: Open screenshot pull request
        if: success() && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CHECK_WORKFLOWS: |
            autopilot.yml
        run: |
          mkdir -p docs/screenshots
          cp dist/screenshots/*.png docs/screenshots/
          SCREENSHOT_PATHS="$(for file in dist/screenshots/*.png; do printf 'docs/screenshots/%s\n' "${file##*/}"; done)"
          export SCREENSHOT_PATHS
          bash .github/scripts/open-screenshot-pr.sh

      - name: Upload PNG screenshots
        uses: actions/upload-artifact@v4
        with:
          name: wxcommand-pro-demo-screenshots
          path: dist/screenshots/*.png
          if-no-files-found: error
