name: WXCOMMAND-PRO AutoPilot

on:
  push:
    branches: [main, feature/phase3-stability-release, feature/phase4-ux]
  pull_request:
  schedule:
    - cron: '17 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: autopilot-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m compileall -q app tests
      - run: python -m pytest -q tests
      - run: python -m app.smokecheck

  security:
    name: Dependency security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt pip-audit
      - run: python -m pip_audit

  build-macos:
    name: macOS Intel launcher smoke build
    runs-on: macos-15-intel
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m venv .venv
      - run: .venv/bin/python -m pip install -r requirements.txt
      - run: .venv/bin/python deploy/build_macos_app.py
      - name: Validate bundle metadata
        run: |
          test -x "dist/WXCOMMAND-PRO.app/Contents/MacOS/WXCOMMAND-PRO"
          plutil -lint "dist/WXCOMMAND-PRO.app/Contents/Info.plist"
      - name: Archive macOS launcher
        run: |
          # Archive before upload so the .app root and executable modes survive transport.
          (cd dist && zip -qry WXCOMMAND-PRO-macOS-Intel.zip WXCOMMAND-PRO.app)
          unzip -tq dist/WXCOMMAND-PRO-macOS-Intel.zip
      - uses: actions/upload-artifact@v4
        with:
          name: wxcommand-pro-macos-intel-launcher
          path: dist/WXCOMMAND-PRO-macOS-Intel.zip
          if-no-files-found: error

  build-pi:
    name: Raspberry Pi compatible source package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Bundle source and installer
        run: |
          tar --exclude=.git --exclude=dist --exclude=.venv -czf wxcommand-pro-pi-source.tar.gz app deploy requirements.txt pyproject.toml README.md docs
          tar -tzf wxcommand-pro-pi-source.tar.gz > /dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: wxcommand-pro-pi-source
          path: wxcommand-pro-pi-source.tar.gz
          if-no-files-found: error

  release-gate:
    name: Automated release gate
    if: always()
    needs: [quality, security, build-macos, build-pi]
    runs-on: ubuntu-latest
    steps:
      - name: Require all gates
        env:
          QUALITY: ${{ needs.quality.result }}
          SECURITY: ${{ needs.security.result }}
          MAC: ${{ needs.build-macos.result }}
          PI: ${{ needs.build-pi.result }}
        run: |
          for result in "$QUALITY" "$SECURITY" "$MAC" "$PI"; do
            test "$result" = "success" || exit 1
          done
          echo "Software checks passed; hardware, signing and production validation remain separate."
