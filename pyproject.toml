[project]
name = "wxcommand-pro"
version = "1.1.2"
description = "Self-hosted weather intelligence and mesh radio command center for Meshtastic and MeshCore"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "WXCOMMAND-PRO Contributors" }]
keywords = ["meshtastic", "meshcore", "nws", "weather", "alerts", "emergency", "lora"]

[project.urls]
Homepage = "https://github.com/BaconDisk22/WXCOMMAND-PRO"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "-q"

[tool.setuptools]
packages = ["app", "app.web"]
